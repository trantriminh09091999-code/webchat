<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4 Anh Tày — Chat nhóm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Màn hình đăng nhập / đăng ký -->
<div id="authScreen" class="join-screen">
  <div class="join-card">
    <div class="join-mark">4T</div>
    <h1>4 Anh Tày</h1>
    <p class="join-sub">Đăng nhập để vào nhóm chat.</p>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="auth-tab active">Đăng nhập</button>
      <button type="button" id="tabRegister" class="auth-tab">Đăng ký</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input id="loginUsername" type="text" placeholder="Tên đăng nhập" maxlength="24" autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
      <div id="loginError" class="auth-error hidden"></div>
      <button type="submit" id="loginBtn">Đăng nhập</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input id="registerUsername" type="text" placeholder="Tên đăng nhập (tối đa 24 ký tự)" maxlength="24" autocomplete="username" />
      <input id="registerPassword" type="password" placeholder="Mật khẩu (tối thiểu 4 ký tự)" autocomplete="new-password" />
      <div id="registerError" class="auth-error hidden"></div>
      <button type="submit" id="registerBtn">Tạo tài khoản</button>
    </form>
  </div>
</div>

<!-- Giao diện chat chính -->
<div id="chatScreen" class="chat-screen hidden">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="join-mark small">4T</div>
      <div>
        <h2>4 Anh Tày</h2>
        <span id="groupCountLabel" class="room-tag">0 nhóm</span>
      </div>
    </div>

    <div class="sidebar-label-row">
      <span class="sidebar-label">Nhóm của bạn</span>
      <button id="quickAddGroupBtn" class="icon-btn-mini" title="Tạo nhóm" aria-label="Tạo nhóm">+</button>
    </div>

    <ul id="groupList" class="group-list"></ul>

    <button id="createGroupBtn" type="button" class="create-group-btn">+ Tạo nhóm mới</button>

    <div class="sidebar-foot">
      <span id="myNameLabel"></span>
      <button id="logoutBtn" type="button">Đăng xuất</button>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <button id="menuBtn" class="menu-btn" aria-label="Danh sách nhóm">☰</button>
      <div id="currentGroupAvatar" class="group-avatar header-avatar"></div>
      <div>
        <h2 id="currentGroupName">—</h2>
        <span id="typingIndicator" class="typing-indicator"></span>
      </div>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="composer" class="composer">
      <button type="button" id="attachBtn" class="icon-btn" title="Gửi ảnh / video" aria-label="Đính kèm file">📎</button>
      <input id="fileInput" type="file" accept="image/*,video/*" hidden />
      <input id="textInput" type="text" placeholder="Nhắn gì đó, dán link cũng được…" autocomplete="off" />
      <button type="submit" class="send-btn" aria-label="Gửi">Gửi</button>
    </form>

    <div id="attachPreview" class="attach-preview hidden">
      <span id="attachName"></span>
      <button type="button" id="cancelAttach">✕</button>
    </div>
  </main>
</div>

<!-- Hộp thoại tạo nhóm -->
<div id="createGroupModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>Tạo nhóm mới</h3>
    <input id="newGroupName" type="text" placeholder="Tên nhóm (vd: Cà phê cuối tuần)" maxlength="40" />
    <div id="createGroupError" class="auth-error hidden"></div>
    <div class="modal-actions">
      <button type="button" id="cancelCreateGroup" class="modal-btn-secondary">Hủy</button>
      <button type="button" id="confirmCreateGroup" class="modal-btn-primary">Tạo nhóm</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
