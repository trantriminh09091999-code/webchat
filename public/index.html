<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>4 Anh Tày — Chat nhóm</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile-performance.css?v=1">
</head>
<body>
<div id="toast" class="toast hidden"></div>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-logo">4T</div><h1>4 Anh Tày</h1><p>Chat, lưu kỷ niệm và lên kèo cùng anh em.</p>
    <div class="auth-tabs"><button id="tabLogin" class="active">Đăng nhập</button><button id="tabRegister">Đăng ký</button></div>
    <form id="loginForm" class="auth-form"><input id="loginUsername" placeholder="Tên đăng nhập"><input id="loginPassword" type="password" placeholder="Mật khẩu"><div id="loginError" class="error hidden"></div><button>Đăng nhập</button></form>
    <form id="registerForm" class="auth-form hidden"><input id="registerUsername" placeholder="Tên đăng nhập"><input id="registerPassword" type="password" placeholder="Mật khẩu tối thiểu 6 ký tự"><div id="registerError" class="error hidden"></div><button>Tạo tài khoản</button></form>
  </div>
</section>
<div id="chatScreen" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand-row"><div class="brand-logo small">4T</div><div><strong>4 Anh Tày</strong><span id="groupCountLabel">0 nhóm</span></div><button id="closeMenuBtn">×</button></div>
    <div class="side-title"><span>Nhóm chat</span><button id="quickAddGroupBtn">＋</button></div>
    <ul id="groupList"></ul>
    <button id="createGroupBtn" class="wide-btn">＋ Tạo nhóm mới</button>
    <div class="online-box"><div class="side-title"><span>Đang online</span><b id="onlineCount">0</b></div><div id="onlineUsers"></div></div>
    <button id="profileBtn" class="profile-card"><div id="myAvatar" class="avatar"></div><div><strong id="myNameLabel"></strong><span>Hồ sơ & cài đặt</span></div>⚙</button>
  </aside>
  <div id="mobileOverlay" class="overlay hidden"></div>
  <main class="main">
    <header class="header"><button id="menuBtn">☰</button><div id="currentGroupAvatar" class="avatar"></div><div class="header-copy"><strong id="currentGroupName">Chọn nhóm</strong><span id="groupStatus">Sẵn sàng trò chuyện</span><small id="typingIndicator"></small></div><button id="groupInfoBtn" class="circle-btn">⋯</button></header>
    <div id="pinnedBar" class="pinned-bar hidden"></div>
    <section id="messages" class="messages"><div class="empty-state">💬<h3>Chọn nhóm để bắt đầu</h3></div></section>
    <div id="uploadProgress" class="upload-progress hidden"><span id="uploadLabel">Đang gửi file…</span><div><i id="uploadBar"></i></div></div>
    <div id="attachPreview" class="attach-preview hidden"><div id="previewThumb"></div><div><strong id="attachName"></strong><span id="attachMeta"></span></div><button id="cancelAttach">×</button></div>
    <form id="composer" class="composer"><button type="button" id="attachBtn">＋</button><input id="fileInput" type="file" accept="image/*,video/*" hidden><textarea id="textInput" rows="1" placeholder="Nhập tin nhắn…"></textarea><button id="sendBtn">➤</button></form>
  </main>
</div>
<div id="createGroupModal" class="modal hidden"><div class="modal-card"><h2>Tạo nhóm</h2><input id="newGroupName" placeholder="Tên nhóm"><div id="createGroupError" class="error hidden"></div><div class="actions"><button id="cancelCreateGroup">Hủy</button><button id="confirmCreateGroup" class="primary">Tạo</button></div></div></div>
<div id="mediaModal" class="media-modal hidden"><button id="closeMediaModal">×</button><div id="mediaModalContent"></div></div>
<div id="drawer" class="drawer hidden"><div class="drawer-head"><h2 id="drawerTitle">Thông tin nhóm</h2><button id="closeDrawer">×</button></div><div id="drawerContent"></div></div>
<template id="groupInfoTemplate"><div class="settings-list">
<button data-view="media">🖼 Ảnh và video đã gửi</button><button data-view="members">👥 Thành viên & biệt danh</button><button data-view="pins">📌 Tin nhắn đã ghim</button><button data-view="events">🎮 Lịch chơi game / đi chơi</button><button data-view="memories">💫 Kho kỷ niệm</button><button data-action="mute">🔕 Tắt/bật thông báo nhóm</button><button data-action="rename">✏️ Đổi tên nhóm</button><button data-action="leave" class="danger">🚪 Rời nhóm</button><button data-action="delete" class="danger">🗑 Xóa nhóm</button></div></template>
<script src="/socket.io/socket.io.js"></script>
<script src="client.js?v=5"></script>
<script src="realtime-fix.js?v=1"></script>
</body></html>
